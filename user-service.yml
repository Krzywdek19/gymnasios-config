server:
  port: 8081

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: ${USER_DB_URL:jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${USER_DB_DRIVER:org.h2.Driver}
    username: ${USER_DB_USERNAME:sa}
    password: ${USER_DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: ${USER_JPA_DDL_AUTO:update}
    show-sql: ${USER_SHOW_SQL:false}
  h2:
    console:
      enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

secret:
  key: ${JWT_SECRET}
  access-duration: ${JWT_ACCESS_DURATION:360000}
  refresh-duration: ${JWT_REFRESH_DURATION:86400}
  issuer: ${JWT_ISSUER:user-service}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    doc-expansion: none
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

app:
  mail-from: ${MAIL_FROM:no-reply@gymnasios.local}
  frontend-base-url: ${FRONTEND_BASE_URL}
