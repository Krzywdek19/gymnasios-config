server:
  port: 8082

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    url: ${WORKOUT_DB_URL:jdbc:h2:mem:workoutdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${WORKOUT_DB_DRIVER:org.h2.Driver}
    username: ${WORKOUT_DB_USERNAME:sa}
    password: ${WORKOUT_DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: ${WORKOUT_JPA_DDL_AUTO:update}
    show-sql: ${WORKOUT_SHOW_SQL:false}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
    doc-expansion: none
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  show-actuator: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}

secret:
  key: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:user-service}