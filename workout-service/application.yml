spring:
  application:
    name: workout-service
  mvc: 
    pathmatch:
      matching-strategy: ant_path_matcher
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  show-actuator: false
server:
  port: 8082
